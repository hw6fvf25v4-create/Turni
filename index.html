<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Turni">
<meta name="theme-color" content="#1C1714">
<title>Turni</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1C1714; --surface:#26201C; --surface-2:#322A25; --line:#3C342E;
    --text:#F4EDE3; --dim:#A99E93; --faint:#71675F;
    --tomato:#E4533B; --tomato-ink:#FFF7F3; --tomato-soft:rgba(228,83,59,.17); --tomato-text:#FF8C75;
    --basil:#7DB46B; --basil-ink:#12200F; --basil-soft:rgba(125,180,107,.17); --basil-text:#A3D392;
    --dough:#F0DCB4; --dough-ink:#2B1F12;
    --tabbar-h:62px;
    --safe-t:env(safe-area-inset-top, 0px);
    --safe-b:env(safe-area-inset-bottom, 0px);
    --display:"Bricolage Grotesque", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    --body:-apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html{background:var(--bg); color-scheme:dark}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--body); font-size:16px; line-height:1.4;
    -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%;
    padding-bottom:calc(var(--tabbar-h) + var(--safe-b) + 28px);
  }
  body[data-tab="disp"]{padding-bottom:calc(var(--tabbar-h) + var(--safe-b) + 96px)}
  body::before{content:""; position:fixed; top:0; left:0; right:0; height:var(--safe-t); background:var(--bg); z-index:30}
  button, input, select{font:inherit; color:inherit}
  button{cursor:pointer; touch-action:manipulation; -webkit-user-select:none; user-select:none}
  :focus-visible{outline:2px solid var(--dough); outline-offset:2px}

  #view{max-width:560px; margin:0 auto; padding:calc(var(--safe-t) + 6px) 16px 0}

  /* Intestazione stile iOS */
  .top{margin:0 0 16px}
  .nav{display:flex; justify-content:space-between; align-items:center; min-height:44px}
  .link{background:none; border:0; color:var(--tomato-text); font-size:16px; font-weight:600; padding:10px 0; white-space:nowrap}
  h1{font-family:var(--display); font-size:34px; line-height:1.05; font-weight:800; letter-spacing:-.025em; margin:2px 0 0}
  .sub{margin:6px 0 0; color:var(--dim); font-size:14.5px}

  .note{background:var(--surface); border-radius:14px; padding:12px 14px; font-size:14px; color:var(--dim); margin:0 0 12px; display:flex; align-items:center; justify-content:space-between; gap:12px}
  .note .link{padding:0}
  .note.warn{color:var(--tomato-text); background:var(--tomato-soft)}

  /* Griglia disponibilità */
  .grid{background:var(--surface); border-radius:20px; padding:0 10px 10px}
  .grid-head, .grow{display:grid; grid-template-columns:minmax(70px,1fr) repeat(7, minmax(0,42px)); gap:4px; align-items:center}
  .grid-head{position:sticky; top:var(--safe-t); z-index:3; background:var(--surface); padding:10px 0 6px; border-radius:20px 20px 0 0; border-bottom:1px solid var(--line)}
  .gh{display:flex; flex-direction:column; align-items:center; gap:1px}
  .gh b{font-family:var(--display); font-size:16px; font-weight:700}
  .gh small{font-size:11px; color:var(--dim); font-variant-numeric:tabular-nums}
  .gh.short small{color:var(--tomato-text); font-weight:700}
  .gh.corner{align-items:flex-start; justify-content:flex-end; align-self:end}
  .gh.corner small{font-size:10.5px; color:var(--faint)}
  .tier-label{font-size:12.5px; color:var(--faint); margin:14px 0 4px}
  .grow{padding:2px 0}
  .gname{background:none; border:0; text-align:left; padding:8px 0; font-size:15.5px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .cell{aspect-ratio:1; width:100%; padding:0; border-radius:10px; border:1.5px solid var(--line); background:transparent; display:grid; place-items:center; color:var(--dough-ink); transition:background-color .12s, border-color .12s}
  .cell.on{background:var(--dough); border-color:var(--dough)}
  .cell.on::after{content:""; width:11px; height:6px; border-left:2.5px solid currentColor; border-bottom:2.5px solid currentColor; transform:translateY(-1.5px) rotate(-45deg)}

  .cta{position:fixed; left:0; right:0; bottom:calc(var(--tabbar-h) + var(--safe-b)); z-index:9; padding:10px 16px; display:flex; justify-content:center; background:rgba(28,23,20,.9); -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px)}
  .primary{width:100%; max-width:528px; height:52px; border:0; border-radius:15px; background:var(--tomato); color:var(--tomato-ink); font-family:var(--display); font-size:18px; font-weight:700; letter-spacing:.005em}
  .primary:active{filter:brightness(.92)}

  /* Turni */
  .day{background:var(--surface); border-radius:20px; padding:14px 14px 4px; margin-bottom:12px}
  .day-h{display:flex; align-items:center; gap:10px; margin-bottom:4px}
  .day-h h2{font-family:var(--display); font-size:21px; font-weight:700; margin:0; flex:1; letter-spacing:-.01em}
  .day-status{font-size:13px; color:var(--dim)}
  .day-status.short{color:var(--tomato-text); font-weight:600}
  .copy{height:34px; padding:0 15px; border-radius:999px; border:0; background:var(--surface-2); font-size:14px; font-weight:600; transition:background-color .15s}
  .copy.done{background:var(--basil); color:var(--basil-ink)}
  .slots{list-style:none; margin:0; padding:0}
  .slot{display:flex; align-items:center; gap:10px; min-height:50px; border-top:1px solid var(--line)}
  .slot:first-child{border-top:0}
  .slot .n{width:14px; flex:none; text-align:right; color:var(--faint); font-size:13px; font-variant-numeric:tabular-nums}
  .pick{position:relative; flex:1; min-width:0; display:flex; align-items:center; gap:7px; height:46px}
  .pname{font-size:17px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0}
  .pname.empty{color:var(--faint)}
  .lv{font-size:11.5px; color:var(--faint); flex:none}
  .flag{font-size:11px; color:var(--tomato-text); flex:none}
  .chev{width:14px; height:14px; color:var(--faint); flex:none}
  .pick select{position:absolute; inset:0; width:100%; height:100%; opacity:0; font-size:16px; cursor:pointer; -webkit-appearance:none; appearance:none}
  .time{flex:none; height:30px; padding:0 10px; border-radius:999px; border:0; font-size:13px; font-weight:700; font-variant-numeric:tabular-nums}
  .time.e{background:var(--tomato-soft); color:var(--tomato-text)}
  .time.l{background:var(--basil-soft); color:var(--basil-text)}
  .addslot{display:block; background:none; border:0; color:var(--dim); font-size:14px; padding:10px 0 10px 24px}

  .empty-state{background:var(--surface); border-radius:20px; padding:28px 20px; text-align:center}
  .empty-state h2{font-family:var(--display); font-size:21px; margin:0 0 6px}
  .empty-state p{color:var(--dim); margin:0 0 18px; font-size:15px}
  .empty-state .primary{max-width:280px}

  /* Bilancio */
  .summary{font-size:15px; color:var(--dim); margin:0 0 12px}
  .summary b{color:var(--text); font-weight:600}
  .summary .short{color:var(--tomato-text); font-weight:600}
  .legend{display:flex; flex-wrap:wrap; gap:6px 14px; font-size:12.5px; color:var(--dim); margin:0 0 14px}
  .legend span{display:inline-flex; align-items:center; gap:6px}
  .group-label{font-size:13px; color:var(--dim); margin:18px 4px 8px}
  .list{background:var(--surface); border-radius:20px; padding:0 14px}
  .bp{display:flex; align-items:center; gap:12px; padding:12px 0; border-top:1px solid var(--line)}
  .bp:first-child{border-top:0}
  .bp-main{flex:1; min-width:0}
  .bp-name{font-size:17px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .dots{display:flex; gap:4px; margin:7px 0 5px}
  .dot{width:21px; height:21px; flex:none; border-radius:50%; display:grid; place-items:center; font-size:10px; font-weight:700; line-height:1}
  .dot.sm{width:14px; height:14px; font-size:0}
  .dot.e{background:var(--tomato); color:var(--tomato-ink)}
  .dot.l{background:var(--basil); color:var(--basil-ink)}
  .dot.a{border:1.5px solid var(--dim); color:var(--dim)}
  .dot.x{color:var(--faint); opacity:.55}
  .dot.sm.x{border:1.5px dashed var(--faint)}
  .bp-sub{font-size:12.5px; color:var(--dim)}
  .stepper{display:flex; align-items:center; background:var(--surface-2); border-radius:13px; flex:none}
  .stepper button{width:40px; height:42px; border:0; background:none; font-size:22px; line-height:1; color:var(--text)}
  .stepper button:disabled{color:var(--faint); opacity:.45; cursor:default}
  .stepper .val{min-width:26px; text-align:center; font-family:var(--display); font-size:23px; font-weight:800; font-variant-numeric:tabular-nums}

  /* Impostazioni */
  .section-title{font-size:13px; color:var(--dim); margin:22px 4px 8px}
  .section-title:first-of-type{margin-top:4px}
  .card{background:var(--surface); border-radius:20px; padding:0 14px}
  .lvl + .lvl{border-top:1px solid var(--line)}
  .lvl-h{font-size:12.5px; color:var(--faint); padding:12px 0 2px}
  .list-row{display:flex; align-items:center; gap:10px; width:100%; min-height:46px; padding:0; border:0; background:none; text-align:left}
  .list-row .grow, .set-row .grow{flex:1; min-width:0}
  .list-row .grow{font-size:16.5px; font-weight:500}
  .set-row .grow{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .tag{font-size:12px; color:var(--dim)}
  .chev-r{width:16px; height:16px; color:var(--faint); flex:none}
  .list-empty{color:var(--faint); font-size:14.5px; padding:10px 0 12px}
  .add-row{display:flex; align-items:center; gap:10px; width:100%; min-height:52px; border:0; border-top:1px solid var(--line); background:none; color:var(--tomato-text); font-weight:600; padding:0}
  .add-row .plus{width:24px; height:24px; border-radius:50%; background:var(--tomato); color:var(--tomato-ink); display:grid; place-items:center; font-size:18px; line-height:1}
  .set-row{display:flex; align-items:center; gap:10px; min-height:52px; border-top:1px solid var(--line)}
  .set-row:first-child{border-top:0}
  .set-row.head{min-height:38px; font-size:12.5px; color:var(--faint)}
  .set-row.head span:not(.grow){width:100px; text-align:center}
  .mini{display:flex; align-items:center; width:100px; justify-content:space-between; background:var(--surface-2); border-radius:11px}
  .mini button{width:34px; height:36px; border:0; background:none; font-size:19px; line-height:1}
  .mini button:disabled{opacity:.35; cursor:default}
  .mini span{font-weight:700; font-variant-numeric:tabular-nums; font-size:16px}
  .time-in{width:66px; height:38px; border-radius:10px; border:1.5px solid var(--line); background:var(--surface-2); text-align:center; font-size:16px; font-variant-numeric:tabular-nums}
  .dash{color:var(--faint)}
  .foot{font-size:13px; color:var(--faint); margin:8px 4px 0}
  .btn-row{display:flex; gap:10px; padding:14px 0}
  .soft{flex:1; height:46px; border-radius:13px; border:0; background:var(--surface-2); font-weight:600; font-size:15px}
  .danger-link{display:block; width:100%; background:none; border:0; color:var(--tomato-text); font-weight:600; padding:18px 0 4px; text-align:center}

  /* Foglio a comparsa */
  .sheet-root{position:fixed; inset:0; z-index:50; display:none}
  .sheet-root.open{display:block}
  .backdrop{position:absolute; inset:0; background:rgba(0,0,0,.55); animation:fade .2s ease-out}
  .sheet{position:absolute; left:0; right:0; bottom:0; max-width:560px; margin:0 auto; background:var(--surface); border-radius:24px 24px 0 0; padding:8px 18px calc(18px + var(--safe-b)); animation:up .26s cubic-bezier(.2,.85,.25,1)}
  .grabber{width:38px; height:5px; border-radius:3px; background:var(--line); margin:0 auto 6px}
  .sheet-nav{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px}
  .sheet-nav h3{font-family:var(--display); font-size:22px; margin:0}
  .field{display:block; margin-bottom:16px}
  .field > span{display:block; font-size:13px; color:var(--dim); margin-bottom:7px}
  .field input{width:100%; height:50px; border-radius:13px; border:1.5px solid var(--line); background:var(--surface-2); font-size:17px; padding:0 14px}
  .hint{display:block; font-size:12.5px; color:var(--faint); margin-top:7px}
  .seg{display:grid; grid-template-columns:repeat(5,1fr); gap:3px; background:var(--surface-2); border-radius:13px; padding:3px}
  .seg button{height:42px; border:0; border-radius:10px; background:none; color:var(--dim); font-family:var(--display); font-size:18px; font-weight:700}
  .seg button.on{background:var(--dough); color:var(--dough-ink)}
  .switch-row{display:flex; align-items:center; justify-content:space-between; gap:14px; padding:4px 0 20px; cursor:pointer}
  .switch-row > span{font-size:16px; font-weight:500}
  .switch-row small{display:block; font-size:12.5px; color:var(--dim); font-weight:400; margin-top:2px}
  .switch-row input{position:absolute; opacity:0; pointer-events:none}
  .sw{width:51px; height:31px; flex:none; border-radius:16px; background:var(--line); position:relative; transition:background-color .18s}
  .sw::after{content:""; position:absolute; top:2px; left:2px; width:27px; height:27px; border-radius:50%; background:#fff; transition:transform .18s}
  input:checked + .sw{background:var(--basil)}
  input:checked + .sw::after{transform:translateX(20px)}
  input:focus-visible + .sw{outline:2px solid var(--dough); outline-offset:2px}
  .sheet .danger-link{padding-bottom:0}

  /* Barra delle schede */
  .tabbar{position:fixed; left:0; right:0; bottom:0; z-index:10; display:grid; grid-template-columns:repeat(4,1fr); height:calc(var(--tabbar-h) + var(--safe-b)); padding-bottom:var(--safe-b); background:rgba(28,23,20,.9); -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px); border-top:1px solid var(--line)}
  .tab{background:none; border:0; color:var(--faint); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; font-size:10.5px; font-weight:600; padding:0}
  .tab svg{width:25px; height:25px}
  .tab.on{color:var(--text)}
  .tab.on svg{color:var(--tomato)}

  .toast{position:fixed; left:50%; bottom:calc(var(--tabbar-h) + var(--safe-b) + 14px); transform:translate(-50%, 12px); z-index:40; max-width:calc(100% - 32px); width:max-content; background:var(--dough); color:var(--dough-ink); font-size:14.5px; font-weight:600; padding:11px 16px; border-radius:14px; box-shadow:0 8px 28px rgba(0,0,0,.4); opacity:0; pointer-events:none; transition:opacity .2s, transform .2s}
  body[data-tab="disp"] .toast{bottom:calc(var(--tabbar-h) + var(--safe-b) + 84px)}
  .toast.show{opacity:1; transform:translate(-50%, 0)}

  @keyframes fade{from{opacity:0}}
  @keyframes up{from{transform:translateY(100%)}}
  @media (prefers-reduced-motion: reduce){
    .backdrop, .sheet{animation:none}
    .toast, .cell, .sw, .sw::after, .copy{transition:none}
  }
</style>
</head>
<body data-tab="disp">
<main id="view"></main>

<nav class="tabbar" aria-label="Sezioni">
  <button class="tab" data-act="tab" data-tab="disp">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M3.5 9.8h17M8 3v4M16 3v4"/><path d="M9 15l2.1 2.1L15.2 13"/></svg>
    <span>Disponibilità</span>
  </button>
  <button class="tab" data-act="tab" data-tab="turni">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.6"/><path d="M12 7.3V12l3.2 2"/></svg>
    <span>Turni</span>
  </button>
  <button class="tab" data-act="tab" data-tab="bil">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20v-8M10 20V5M15 20v-11M20 20v-5"/></svg>
    <span>Bilancio</span>
  </button>
  <button class="tab" data-act="tab" data-tab="imp">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h9M18 7h2M4 17h3M11 17h9"/><circle cx="15.5" cy="7" r="2.3"/><circle cx="9" cy="17" r="2.3"/></svg>
    <span>Impostazioni</span>
  </button>
</nav>

<div class="sheet-root" id="sheet"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="import-file" accept=".json,application/json" hidden>

<script>
/* =========================================================
   Turni pizzeria – v2 con memoria sul dispositivo
   ========================================================= */
const KEY = "turni-pizzeria-v2";
const GIORNI = ["Lunedì","Martedì","Mercoledì","Giovedì","Venerdì","Sabato","Domenica"];
const G1 = ["L","M","M","G","V","S","D"];
const DAYS = [0,1,2,3,4,5,6];
const TIERS = [1,2,3,4,5];

const $ = s => document.querySelector(s);
const uid = () => "p" + Math.random().toString(36).slice(2, 9);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cmp = (a, b) => { for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return a[i] - b[i]; return 0; };
const CHEV_D = `<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>`;
const CHEV_R = `<svg class="chev-r" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>`;

/* ---------- Stato ---------- */
function defaultState(){
  const roster = [
    ["Luca",1],
    ["Pole",2],["Claudio",2],["Alex",2],
    ["Zacca",3],["Pietro",3],
    ["Luca R",4],["Filippo",4],["Giovi",4],["Fede",4],["Fra",4],
  ];
  const s = {
    v: 2,
    people: roster.map(([name, tier]) => ({ id: uid(), name, tier, pre: tier >= 4 })),
    days: [[3,1],[4,2],[4,2],[4,2],[5,2],[7,3],[7,3]].map(([posti, early]) => ({ posti, early })),
    times: { early: { start: "18.00", end: "21.00" }, late: { start: "18.30", end: "21.30" } },
    avail: null, schedule: null, edited: false, stale: false, tab: "disp",
  };
  s.avail = presetAvail(s);
  return s;
}
function presetAvail(s){ return DAYS.map(() => s.people.filter(p => p.pre).map(p => p.id)); }

function normalize(s){
  const def = defaultState();
  s.people = (Array.isArray(s.people) ? s.people : [])
    .filter(p => p && p.id && typeof p.name === "string" && p.name.trim())
    .map(p => ({ id: String(p.id), name: p.name.trim(), tier: clamp(Math.round(+p.tier) || 4, 1, 5), pre: !!p.pre }));
  const ids = new Set(s.people.map(p => p.id));
  s.days = (Array.isArray(s.days) && s.days.length === 7)
    ? s.days.map(d => { const posti = clamp(Math.round(+(d && d.posti)) || 0, 0, 20); return { posti, early: clamp(Math.round(+(d && d.early)) || 0, 0, posti) }; })
    : def.days;
  const okT = t => t && typeof t.start === "string" && typeof t.end === "string";
  s.times = (s.times && okT(s.times.early) && okT(s.times.late)) ? s.times : def.times;
  s.avail = (Array.isArray(s.avail) && s.avail.length === 7) ? s.avail : presetAvail(s);
  s.avail = s.avail.map(a => [...new Set((Array.isArray(a) ? a : []).filter(id => ids.has(id)))]);
  s.schedule = (Array.isArray(s.schedule) && s.schedule.length === 7)
    ? s.schedule.map(rows => (Array.isArray(rows) ? rows : []).map(r => ({ id: r && ids.has(r.id) ? r.id : null, early: !!(r && r.early) })))
    : null;
  s.edited = !!s.edited; s.stale = !!s.stale;
  if (!["disp","turni","bil","imp"].includes(s.tab)) s.tab = "disp";
  s.v = 2;
  return s;
}

let storageOK = true;
try { localStorage.setItem("__turni_test", "1"); localStorage.removeItem("__turni_test"); } catch (e) { storageOK = false; }

function load(){
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { const s = JSON.parse(raw); if (s && s.v === 2) return normalize(s); }
  } catch (e) {}
  return defaultState();
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(state)); storageOK = true; }
  catch (e) { storageOK = false; }
}
let state = load();
save();

/* ---------- Utilità ---------- */
const byId = id => state.people.find(p => p.id === id);
const idx = id => state.people.findIndex(p => p.id === id);
const sortedPeople = () => [...state.people].sort((a, b) => a.tier - b.tier || idx(a.id) - idx(b.id));
const isAvail = (id, d) => state.avail[d].includes(id);
const inDay = (id, d) => !!state.schedule && state.schedule[d].some(r => r.id === id);

function counts(sched){
  const tot = {}, early = {};
  state.people.forEach(p => { tot[p.id] = 0; early[p.id] = 0; });
  (sched || []).forEach(rows => rows.forEach(r => {
    if (r.id && r.id in tot) { tot[r.id]++; if (r.early) early[r.id]++; }
  }));
  return { tot, early };
}

/* ---------- Algoritmo ---------- */
// Ordina il giorno d: i posti delle 18.00 vanno ai livelli più alti,
// a parità di livello a chi ne ha fatti meno negli altri giorni.
function arrangeDay(sched, d, tie){
  const rows = sched[d];
  const nEarly = Math.min(state.days[d].early, rows.length);
  const { tot, early } = counts(sched.map((r, i) => i === d ? [] : r));
  const t = tie || (p => idx(p.id));
  const ppl = rows.filter(r => r.id).map(r => byId(r.id)).filter(Boolean);
  ppl.sort((a, b) => a.tier - b.tier || early[a.id] - early[b.id] || tot[a.id] - tot[b.id] || t(a) - t(b));
  const ep = ppl.slice(0, nEarly), lp = ppl.slice(nEarly);
  const out = [
    ...ep.map(p => ({ id: p.id, early: true })),
    ...Array.from({ length: Math.max(0, nEarly - ep.length) }, () => ({ id: null, early: true })),
    ...lp.map(p => ({ id: p.id, early: false })),
  ];
  while (out.length < rows.length) out.push({ id: null, early: false });
  sched[d] = out;
}

function generate(){
  const tot = {};
  state.people.forEach(p => tot[p.id] = 0);
  const sched = DAYS.map(d => {
    const r = {}; state.people.forEach(p => r[p.id] = Math.random());
    const chosen = state.people
      .filter(p => isAvail(p.id, d))
      .sort((a, b) => a.tier - b.tier || tot[a.id] - tot[b.id] || r[a.id] - r[b.id])
      .slice(0, state.days[d].posti);
    chosen.forEach(p => tot[p.id]++);
    const rows = chosen.map(p => ({ id: p.id, early: false }));
    while (rows.length < state.days[d].posti) rows.push({ id: null, early: false });
    return rows;
  });
  DAYS.forEach(d => { const r = {}; state.people.forEach(p => r[p.id] = Math.random()); arrangeDay(sched, d, p => r[p.id]); });
  state.schedule = sched;
  state.edited = false;
  state.stale = false;
}

// + : aggiunge un giorno alla persona. Prima un posto libero,
// altrimenti prende il posto di chi quel giorno ha più giorni in settimana.
function plus(id){
  const s = state.schedule, p = byId(id); if (!s || !p) return;
  const { tot } = counts(s);
  let best = null;
  DAYS.forEach(d => {
    if (!isAvail(id, d) || inDay(id, d)) return;
    const free = s[d].findIndex(r => !r.id);
    if (free >= 0) { const c = { d, i: free, victim: null, key: [1, 0, 0, -d] }; if (!best || cmp(c.key, best.key) > 0) best = c; return; }
    s[d].forEach((r, i) => {
      const q = byId(r.id); if (!q) return;
      const c = { d, i, victim: r.id, key: [0, tot[r.id], q.tier, r.early ? 0 : 1] };
      if (!best || cmp(c.key, best.key) > 0) best = c;
    });
  });
  if (!best) { toast(`${p.name} non ha altri giorni disponibili`); return; }
  const vName = best.victim ? byId(best.victim).name : null;
  s[best.d][best.i].id = id;
  arrangeDay(s, best.d);
  state.edited = true;
  save(); render();
  toast(vName ? `${GIORNI[best.d]}: ${p.name} al posto di ${vName}` : `${GIORNI[best.d]}: ${p.name} nel posto libero`);
}

// − : toglie un giorno alla persona e lo dà al disponibile con meno giorni.
function minus(id){
  const s = state.schedule, p = byId(id); if (!s || !p) return;
  const { tot } = counts(s);
  let best = null;
  DAYS.forEach(d => {
    const i = s[d].findIndex(r => r.id === id); if (i < 0) return;
    state.avail[d].forEach(cid => {
      if (inDay(cid, d)) return;
      const c = byId(cid); if (!c) return;
      const cand = { d, i, repl: cid, key: [-tot[cid], -c.tier, s[d][i].early ? 0 : 1, -idx(cid)] };
      if (!best || cmp(cand.key, best.key) > 0) best = cand;
    });
  });
  if (!best) { toast(`Nessun sostituto libero nei giorni di ${p.name}`); return; }
  const rName = byId(best.repl).name;
  s[best.d][best.i].id = best.repl;
  arrangeDay(s, best.d);
  state.edited = true;
  save(); render();
  toast(`${GIORNI[best.d]}: ${rName} al posto di ${p.name}`);
}

/* ---------- Azioni ---------- */
function commit(){ save(); render(); }

function toggleCell(id, d){
  const a = state.avail[d], k = a.indexOf(id);
  k >= 0 ? a.splice(k, 1) : a.push(id);
  if (state.schedule) state.stale = true;
  commit();
}
function toggleRow(id){
  const all = DAYS.every(d => isAvail(id, d));
  DAYS.forEach(d => {
    const a = state.avail[d], k = a.indexOf(id);
    if (all && k >= 0) a.splice(k, 1);
    if (!all && k < 0) a.push(id);
  });
  if (state.schedule) state.stale = true;
  commit();
}
function newWeek(){
  if (!confirm("Nuova settimana: le disponibilità tornano quelle di default e i turni generati vengono cancellati. Continuare?")) return;
  state.avail = presetAvail(state);
  state.schedule = null; state.edited = false; state.stale = false;
  commit();
  toast("Nuova settimana pronta");
}
function onGenerate(){
  if (state.schedule && state.edited && !confirm("Rigenerare i turni? Le modifiche fatte a mano andranno perse.")) return;
  generate();
  state.tab = "turni";
  save(); render(false);
  window.scrollTo(0, 0);
}
function pick(d, i, val){
  const rows = state.schedule[d];
  if (val === "__del") {
    rows.splice(i, 1);
  } else {
    const newId = val || null, old = rows[i].id;
    if (newId) { const j = rows.findIndex((r, k) => k !== i && r.id === newId); if (j >= 0) rows[j].id = old; }
    rows[i].id = newId;
  }
  state.edited = true;
  commit();
}
function toggleTime(d, i){
  const rows = state.schedule[d];
  rows[i].early = !rows[i].early;
  const e = rows.filter(r => r.early), l = rows.filter(r => !r.early);
  state.schedule[d] = [...e, ...l];
  state.edited = true;
  commit();
}
function addSlot(d){
  state.schedule[d].push({ id: null, early: false });
  state.edited = true;
  commit();
}
async function copyDay(d, btn){
  const text = state.schedule[d].map(r => r.id ? byId(r.id).name.toUpperCase() : "").join("\n");
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove();
  }
  btn.textContent = "Copiato"; btn.classList.add("done");
  setTimeout(() => { btn.textContent = "Copia"; btn.classList.remove("done"); }, 1500);
}
function setDay(d, k, delta){
  const day = state.days[d];
  if (k === "posti") { day.posti = clamp(day.posti + delta, 0, 20); day.early = Math.min(day.early, day.posti); }
  else day.early = clamp(day.early + delta, 0, day.posti);
  commit();
}
function setTime(path, val, input){
  const [k, f] = path.split(".");
  const m = String(val).trim().match(/^(\d{1,2})[.:,]?(\d{2})$/);
  if (!m || +m[1] > 23 || +m[2] > 59) { input.value = state.times[k][f]; toast("Scrivi l'orario così: 18.30"); return; }
  state.times[k][f] = `${m[1].padStart(2, "0")}.${m[2]}`;
  commit();
}
function savePerson(id, name, tier, pre){
  name = name.trim().replace(/\s+/g, " ");
  if (!name) { toast("Scrivi un nome"); return false; }
  if (state.people.some(p => p.id !== id && p.name.toLowerCase() === name.toLowerCase())) { toast(`${name} è già in squadra`); return false; }
  if (id) {
    Object.assign(byId(id), { name, tier, pre });
  } else {
    const p = { id: uid(), name, tier, pre };
    state.people.push(p);
    if (pre) DAYS.forEach(d => state.avail[d].push(p.id));
  }
  commit();
  return true;
}
function deletePerson(id){
  state.people = state.people.filter(p => p.id !== id);
  state.avail = state.avail.map(a => a.filter(x => x !== id));
  if (state.schedule) state.schedule.forEach(rows => rows.forEach(r => { if (r.id === id) r.id = null; }));
  commit();
}
async function exportBackup(){
  const { tab, ...data } = state;
  const json = JSON.stringify(data, null, 2);
  const name = `turni-backup-${new Date().toISOString().slice(0, 10)}.json`;
  const file = new File([json], name, { type: "application/json" });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: "Backup turni" }); return; }
    catch (e) { if (e.name === "AbortError") return; }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(file); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function resetAll(){
  if (!confirm("Ripristinare squadra, posti e orari iniziali? Tutte le modifiche salvate andranno perse.")) return;
  state = defaultState(); state.tab = "imp";
  commit();
  toast("Dati iniziali ripristinati");
}

function viewTurni(){
  const s = state.schedule;
  if (!s) return `${banner()}${header("Turni")}
    <div class="empty-state"><h2>Nessun turno generato</h2><p>Segna chi è disponibile e premi Genera turni.</p>
    <button class="primary" data-act="tab" data-tab="disp">Vai alle disponibilità</button></div>`;
  return `${banner()}
    ${header("Turni", "Tocca un nome per cambiarlo, l'orario per spostarlo.", `<button class="link" data-act="generate">Rigenera</button>`)}
    ${state.stale ? `<div class="note"><span>Hai cambiato le disponibilità dopo aver generato i turni.</span><button class="link" data-act="generate">Rigenera</button></div>` : ""}
    ${DAYS.map(dayCard).join("")}`;
}
function dayCard(d){
  const rows = state.schedule[d];
  const free = rows.filter(r => !r.id).length;
  const status = free
    ? `<span class="day-status short">${free === 1 ? "1 posto libero" : free + " posti liberi"}</span>`
    : `<span class="day-status">${rows.length} ${rows.length === 1 ? "persona" : "persone"}</span>`;
  return `<section class="day">
    <div class="day-h"><h2>${GIORNI[d]}</h2>${status}<button class="copy" data-act="copy" data-d="${d}">Copia</button></div>
    <ol class="slots">${rows.map((r, i) => slotRow(d, r, i)).join("")}</ol>
    <button class="addslot" data-act="addslot" data-d="${d}">+ Aggiungi posto</button>
  </section>`;
}
function slotRow(d, r, i){
  const p = r.id ? byId(r.id) : null;
  const t = r.early ? state.times.early : state.times.late;
  const ppl = sortedPeople();
  const av = ppl.filter(q => isAvail(q.id, d)), na = ppl.filter(q => !isAvail(q.id, d));
  const opt = q => `<option value="${q.id}"${q.id === r.id ? " selected" : ""}>${esc(q.name)}${q.id !== r.id && inDay(q.id, d) ? " (scambia)" : ""}</option>`;
  return `<li class="slot">
    <span class="n">${i + 1}</span>
    <label class="pick">
      <span class="pname${p ? "" : " empty"}">${p ? esc(p.name) : "Posto libero"}</span>
      ${p ? `<span class="lv">liv. ${p.tier}</span>` : ""}
      ${p && !isAvail(p.id, d) ? `<span class="flag">non disp.</span>` : ""}
      ${CHEV_D}
      <select data-act="pick" data-d="${d}" data-i="${i}" aria-label="Posto ${i + 1}, ${GIORNI[d]}">
        <option value=""${p ? "" : " selected"}>Posto libero</option>
        ${av.length ? `<optgroup label="Disponibili">${av.map(opt).join("")}</optgroup>` : ""}
        ${na.length ? `<optgroup label="Non disponibili">${na.map(opt).join("")}</optgroup>` : ""}
        <option value="__del">Togli questo posto</option>
      </select>
    </label>
    <button class="time ${r.early ? "e" : "l"}" data-act="time" data-d="${d}" data-i="${i}" aria-label="Orario ${t.start}–${t.end}. Tocca per cambiarlo">${t.start}–${t.end}</button>
  </li>`;
}

function viewBil(){
  const s = state.schedule;
  if (!s) return `${banner()}${header("Bilancio")}
    <div class="empty-state"><h2>Ancora niente da contare</h2><p>Genera i turni per vedere quanti giorni fa ognuno.</p>
    <button class="primary" data-act="tab" data-tab="disp">Vai alle disponibilità</button></div>`;
  const { tot, early } = counts(s);
  const slots = s.reduce((a, r) => a + r.length, 0);
  const free = s.reduce((a, r) => a + r.filter(x => !x.id).length, 0);
  const E = state.times.early.start, L = state.times.late.start;
  const groups = TIERS.map(t => ({ t, ppl: sortedPeople().filter(p => p.tier === t) })).filter(g => g.ppl.length);
  const row = p => {
    const dots = DAYS.map(d => {
      const r = s[d].find(x => x.id === p.id), av = isAvail(p.id, d);
      const cls = r ? (r.early ? "e" : "l") : (av ? "a" : "x");
      const what = r ? (r.early ? E : L) : (av ? "disponibile" : "non disponibile");
      return `<span class="dot ${cls}" title="${GIORNI[d]}: ${what}">${G1[d]}</span>`;
    }).join("");
    const nAv = DAYS.filter(d => isAvail(p.id, d)).length;
    const canPlus = DAYS.some(d => isAvail(p.id, d) && !inDay(p.id, d));
    const sub = nAv
      ? `${nAv} ${nAv === 1 ? "giorno disponibile" : "giorni disponibili"}${early[p.id] ? `, ${early[p.id]} alle ${E}` : ""}`
      : "Non disponibile questa settimana";
    return `<div class="bp">
      <div class="bp-main"><div class="bp-name">${esc(p.name)}</div><div class="dots">${dots}</div><div class="bp-sub">${sub}</div></div>
      <div class="stepper">
        <button data-act="minus" data-id="${p.id}" aria-label="Togli un giorno a ${esc(p.name)}"${tot[p.id] ? "" : " disabled"}>−</button>
        <span class="val" aria-label="${tot[p.id]} giorni">${tot[p.id]}</span>
        <button data-act="plus" data-id="${p.id}" aria-label="Aggiungi un giorno a ${esc(p.name)}"${canPlus ? "" : " disabled"}>+</button>
      </div>
    </div>`;
  };
  return `${banner()}
    ${header("Bilancio", "Giorni di lavoro per persona. Con − e + sposti un turno a qualcun altro.")}
    <p class="summary"><b>${slots - free}</b> turni assegnati su <b>${slots}</b> posti${free ? `, <span class="short">${free} ${free === 1 ? "libero" : "liberi"}</span>` : ""}.</p>
    <div class="legend">
      <span><i class="dot sm e"></i>${E}</span><span><i class="dot sm l"></i>${L}</span>
      <span><i class="dot sm a"></i>Disponibile</span><span><i class="dot sm x"></i>Non disponibile</span>
    </div>
    ${groups.map(g => `<div class="group-label">Livello ${g.t}</div><div class="list">${g.ppl.map(row).join("")}</div>`).join("")}`;
}

  const root = $("#sheet");
  root.innerHTML = `
    <div class="backdrop" data-act="closesheet"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t">
      <div class="grabber"></div>
      <div class="sheet-nav"><h3 id="sh-t">${id ? "Modifica persona" : "Nuova persona"}</h3><button class="link" data-act="closesheet">Annulla</button></div>
      <label class="field"><span>Nome</span><input id="f-name" value="${esc(p.name)}" autocomplete="off" autocapitalize="words" enterkeyhint="done"></label>
      <div class="field"><span>Livello</span>
        <div class="seg" role="radiogroup" aria-label="Livello">${TIERS.map(t => `<button type="button" role="radio" aria-checked="${t === tier}" class="${t === tier ? "on" : ""}" data-t="${t}">${t}</button>`).join("")}</div>
        <small class="hint">Il livello 1 ha la precedenza su tutti.</small>
      </div>
      <label class="switch-row"><span>Sempre segnato<small>A ogni nuova settimana parte già disponibile in tutti i giorni</small></span><input type="checkbox" id="f-pre"${p.pre ? " checked" : ""}><i class="sw" aria-hidden="true"></i></label>
      <button class="primary" id="f-save">${id ? "Salva" : "Aggiungi"}</button>
      ${id ? `<button class="danger-link" id="f-del">Elimina ${esc(p.name)}</button>` : ""}
    </div>`;
  root.classList.add("open");
  root.querySelectorAll(".seg button").forEach(b => b.onclick = () => {
    tier = +b.dataset.t;
    root.querySelectorAll(".seg button").forEach(x => { const on = +x.dataset.t === tier; x.classList.toggle("on", on); x.setAttribute("aria-checked", on); });
  });
  const doSave = () => {
    const name = $("#f-name").value;
    if (savePerson(id, name, tier, $("#f-pre").checked)) { closeSheet(); toast(id ? "Salvato" : `${name.trim()} aggiunto alla squadra`); }
  };
  $("#f-save").onclick = doSave;
  $("#f-name").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); doSave(); } });
  if (id) $("#f-del").onclick = () => {
    if (confirm(`Eliminare ${p.name}? Verrà tolto anche dai turni di questa settimana.`)) { const n = p.name; deletePerson(id); closeSheet(); toast(`${n} eliminato`); }
  };
  if (!id) setTimeout(() => $("#f-name").focus(), 60);
}
function closeSheet(){ const r = $("#sheet"); r.classList.remove("open"); r.innerHTML = ""; }

/* ---------- Toast ---------- */
let toastT;
function toast(msg){
  const el = $("#toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("show"), 2600);
}

/* ---------- Eventi ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const act = b.dataset.act, d = +b.dataset.d, id = b.dataset.id;
  switch (act) {
    case "tab": state.tab = b.dataset.tab; save(); render(false); window.scrollTo(0, 0); break;
    case "cell": toggleCell(id, d); break;
    case "row": toggleRow(id); break;
    case "newweek": newWeek(); break;
    case "generate": onGenerate(); break;
    case "copy": copyDay(d, b); break;
    case "time": toggleTime(d, +b.dataset.i); break;
    case "addslot": addSlot(d); break;
    case "plus": plus(id); break;
    case "minus": minus(id); break;
    case "editp": openPerson(id); break;
    case "addp": openPerson(null); break;
    case "day": setDay(d, b.dataset.k, +b.dataset.delta); break;
    case "export": exportBackup(); break;
    case "import": $("#import-file").click(); break;
    case "reset": resetAll(); break;
    case "closesheet": closeSheet(); break;
  }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.matches("select[data-act=pick]")) pick(+t.dataset.d, +t.dataset.i, t.value);
  else if (t.matches("input[data-time]")) setTime(t.dataset.time, t.value, t);
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#sheet").classList.contains("open")) closeSheet(); });
$("#import-file").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!data || !Array.isArray(data.people) || !Array.isArray(data.days)) throw new Error("formato");
    if (!confirm(`Sostituire i dati attuali con il backup (${data.people.length} persone)?`)) return;
    data.v = 2; data.tab = "imp";
    state = normalize(data);
    commit();
    toast("Backup importato");
  } catch (err) {
    toast("File non valido: scegli un backup esportato da questa app");
  }
});

render(false);
</script>
</body>
</html>
